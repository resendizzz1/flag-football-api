version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: flag_football_db
    restart: always
    environment:
      MYSQL_DATABASE: flag_football
      MYSQL_ROOT_PASSWORD: root_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: flag_football_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=mysql+pymysql://root:root_secure_password@db/flag_football
    depends_on:
      - db

volumes:
  mysql_data: