services:
  db:
    image: mysql:8.0
    container_name: flag_football_db_staging
    restart: always
    environment:
      MYSQL_DATABASE: flag_football_staging
      MYSQL_ROOT_PASSWORD: staging_secure_password
    volumes:
      - mysql_staging_data:/var/lib/mysql

  web:
    build: .
    container_name: flag_football_api_staging
    restart: always
    environment:
      - FLASK_ENV=staging
      - DATABASE_URL=mysql+pymysql://root:staging_secure_password@db/flag_football_staging
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: flag_football_nginx_staging
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  mysql_staging_data: